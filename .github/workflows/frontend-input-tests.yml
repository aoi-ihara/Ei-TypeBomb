name: Frontend input tests

on:
    pull_request:
        paths:
            - "frontend/**"
            - ".github/workflows/frontend-input-tests.yml"
    push:
        branches: [main]
        paths:
            - "frontend/**"
            - ".github/workflows/frontend-input-tests.yml"

permissions:
    contents: read

jobs:
    input:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - name: Install dependencies
              run: npm ci
              working-directory: frontend
            - name: Test kana and hyphen input
              run: npm run test:kana
              working-directory: frontend
            - name: Typecheck
              run: npx tsc --noEmit
              working-directory: frontend
