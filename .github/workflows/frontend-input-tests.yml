name: Frontend input tests

on:
    pull_request:
        paths:
            - "frontend/**"
            - ".github/workflows/frontend-input-tests.yml"
    push:
        branches: [main]
        paths:
            - "frontend/**"
            - ".github/workflows/frontend-input-tests.yml"

permissions:
    contents: read

jobs:
    input:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - name: Install dependencies
              run: npm ci
              working-directory: frontend
            - name: Test kana and hyphen input
              run: npm run test:kana
              working-directory: frontend
            - name: Install selection test browsers
              run: npx playwright install --with-deps chromium webkit
              working-directory: frontend
            - name: Test selection keyboard interactions in browsers
              run: npm run test:selection-browser
              working-directory: frontend
            - name: Typecheck
              run: npx tsc --noEmit
              working-directory: frontend
            - name: Room cache regression tests
              run: npm run test:room-cache
              working-directory: frontend
            - name: Room list regression tests
              run: npm run test:room-list
              working-directory: frontend
