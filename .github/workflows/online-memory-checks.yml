name: Online memory checks

on:
    pull_request:
        paths:
            - "frontend/**"
            - "backend/shared/**"
            - ".github/workflows/online-memory-checks.yml"
    push:
        branches: [main]
        paths:
            - "frontend/**"
            - "backend/shared/**"
            - ".github/workflows/online-memory-checks.yml"

permissions:
    contents: read

jobs:
    frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - name: Install dependencies
              run: npm ci
              working-directory: frontend
            - name: Test online memory and Playground
              run: npm run test:playground
              working-directory: frontend
            - name: Typecheck frontend
              run: npx tsc --noEmit
              working-directory: frontend
