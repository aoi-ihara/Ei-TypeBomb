name: Cloudflare Worker

on:
  pull_request:
    paths:
      - "backend/cloudflare/**"
      - "backend/shared/**"
      - ".github/workflows/cloudflare-worker.yml"
  push:
    branches: [main]
    paths:
      - "backend/cloudflare/**"
      - "backend/shared/**"
      - ".github/workflows/cloudflare-worker.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --prefix backend/cloudflare --no-audit --no-fund
      - name: Typecheck Worker
        run: npm run typecheck --prefix backend/cloudflare
      - name: Test shared gameplay and wire protocol
        run: npm test --prefix backend/cloudflare
