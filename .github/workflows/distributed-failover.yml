name: Distributed failover
on:
  pull_request:
    paths: ['backend/**', 'frontend/lib/room/**', '.github/workflows/distributed-failover.yml']
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/lib/room/**', '.github/workflows/distributed-failover.yml']
jobs:
  websocket-consensus-and-transports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix backend/server
      - run: npm ci --prefix backend/cloudflare
      - name: Install Chromium for real tab-close regression tests
        run: npm exec --prefix backend/cloudflare -- playwright install --with-deps chromium
      - run: npm test --prefix backend/server
      - name: Repeat lifecycle, ownership and transport ordering regressions
        run: npm run test:race --prefix backend/server
        env:
          ETB_RACE_REPEATS: '10'
      - name: Real Node process crashes, authenticated peer WebSockets and workerd
        run: npm run test:integration --prefix backend/cloudflare
