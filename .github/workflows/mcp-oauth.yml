name: MCP OAuth integration
on:
    pull_request:
        paths: ["frontend/**", "supabase/migrations/*mcp_oauth*", ".github/workflows/mcp-oauth.yml"]
    push:
        branches: [main]
        paths: ["frontend/**", "supabase/migrations/*mcp_oauth*", ".github/workflows/mcp-oauth.yml"]
permissions:
    contents: read
jobs:
    oauth:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: etb_mcp_oauth_test
                ports: ["5432:5432"]
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - run: npm ci
              working-directory: frontend
            - run: npm run test:mcp-oauth && npm run test:mcp-server
              working-directory: frontend
              env:
                  ETB_MCP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/etb_mcp_oauth_test
            - run: npx tsc --noEmit
              working-directory: frontend
